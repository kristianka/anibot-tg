services:
  db:
    image: postgres:18.3
    env_file:
      - .env
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:6432" # ONLY FOR LOCAL DEV/TESTING, don't expose prod
    volumes:
      - anibot-tg-dev-db:/var/lib/postgresql
    networks:
      - anibot-tg-dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  anibot-tg:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anibot-tg-dev-network

volumes:
  anibot-tg-dev-db:

networks:
  anibot-tg-dev-network:
    name: anibot-tg-dev-network
    driver: bridge
